<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resource Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Source+Serif+4:ital,wght@0,400;0,500;1,400&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #16233F;
    --navy-light: #24365C;
    --cream: #F6F1E7;
    --cream-dim: #EDE6D6;
    --gold: #B8934F;
    --gold-soft: #D9C393;
    --ink: #1C1C1C;
    --muted: #6B6558;
    --line: rgba(22, 35, 63, 0.14);
    --radius: 4px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    line-height: 1.55;
  }

  a { color: inherit; }

  .skip-link {
    position: absolute;
    left: -999px;
    top: 0;
    background: var(--gold);
    color: var(--navy);
    padding: 0.6rem 1rem;
    z-index: 100;
  }
  .skip-link:focus { left: 1rem; top: 1rem; }

  header.hero {
    background: var(--navy);
    color: var(--cream);
    padding: 4.5rem 1.5rem 3rem;
    text-align: center;
    position: relative;
  }
  header.hero::after {
    content: "";
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 64px; height: 2px;
    background: var(--gold);
  }
  header.hero h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-style: italic;
    font-size: clamp(2.1rem, 5vw, 3rem);
    margin: 0 0 0.6rem;
    letter-spacing: 0.01em;
  }
  header.hero p.tagline {
    font-family: 'Source Sans 3', sans-serif;
    color: var(--gold-soft);
    font-size: 0.95rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0;
  }

  nav.jumpnav {
    background: var(--navy-light);
    padding: 0.9rem 1rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    justify-content: center;
    position: sticky;
    top: 0;
    z-index: 20;
    font-family: 'Source Sans 3', sans-serif;
  }
  nav.jumpnav a {
    text-decoration: none;
    color: var(--cream);
    font-size: 0.85rem;
    padding: 0.4rem 0.9rem;
    border: 1px solid rgba(246,241,231,0.25);
    border-radius: 999px;
    transition: background 0.15s ease, border-color 0.15s ease;
    white-space: nowrap;
  }
  nav.jumpnav a:hover,
  nav.jumpnav a:focus-visible {
    background: rgba(246,241,231,0.1);
    border-color: var(--gold);
    outline: none;
  }

  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 1rem 1.5rem 5rem;
  }

  section.category {
    margin-top: 3.2rem;
    scroll-margin-top: 4.5rem;
  }
  .category-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 2px solid var(--navy);
    padding-bottom: 0.5rem;
    margin-bottom: 1.4rem;
  }
  .category-head h2 {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 1.5rem;
    margin: 0;
    color: var(--navy);
  }
  .category-count {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .category-note {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.92rem;
    color: var(--muted);
    margin: -0.6rem 0 1.2rem;
  }

  ul.resource-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  li.resource-item {
    position: relative;
    padding-left: 1.1rem;
    margin-bottom: 0.45rem;
    font-size: 1rem;
    line-height: 1.45;
    color: #2b2a24;
  }
  li.resource-item::before {
    content: "•";
    position: absolute;
    left: 0;
    color: var(--gold);
    font-weight: 700;
  }
  li.resource-item .name {
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 700;
    color: var(--ink);
  }
  li.resource-item .name a {
    text-decoration: none;
    border-bottom: 1px solid var(--gold);
  }
  li.resource-item .name a:hover,
  li.resource-item .name a:focus-visible { color: var(--navy); outline: none; }
  .tag {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--gold);
    border: 1px solid var(--gold-soft);
    border-radius: 999px;
    padding: 0.05rem 0.5rem;
    white-space: nowrap;
    margin-left: 0.3rem;
  }

  footer {
    text-align: center;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
    padding: 2rem 1rem 3rem;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<a class="skip-link" href="#main-content">Skip to content</a>

<header class="hero">
  <h1>Resource Library</h1>
  <p class="tagline">Tools &amp; references, curated</p>
</header>

<nav class="jumpnav" id="jumpnav" aria-label="Jump to section"></nav>

<main id="main-content"></main>

<footer>
  Last updated: <span id="last-updated"></span>
</footer>

<script>
/* ============================================================
   EDIT BELOW THIS LINE TO ADD OR CHANGE RESOURCES.
   Nothing above this comment needs to change when you update content.

   To add a new resource to an existing category: copy one item
   object (the { ... } block) inside that category's "items" array
   and change the values.

   To add a whole new category: copy one entire object from the
   CATEGORIES array (from "id:" down to the closing "}") and edit it.

   Fields for each resource:
     name        - the resource's name (shown as the link text)
     url         - full link, starting with https://
     description - one or two sentences, plain text
     personal    - true if this is mainly for your own use, not
                   really for students. Set to false (or leave it
                   out) for anything meant to be shared with students.

   Fields for each category:
     id    - short lowercase id, no spaces (used for the jump-nav link)
     title - the heading shown on the page
     note  - optional short description under the heading (delete
             the line entirely if you don't want one)
     items - the list of resources, see above
============================================================ */

const LAST_UPDATED = "July 5, 2026";

const CATEGORIES = [
  {
    id: "ai-tools",
    title: "AI Tools",
    note: "General AI tools worth knowing.",
    items: [
      {
        name: "ChatGPT",
        url: "https://chat.openai.com",
        description: "Perhaps the first AI model most people think of.",
        personal: false
      },
      {
        name: "Claude",
        url: "https://claude.ai/",
        description: "A conversational AI assistant developed by Anthropic, with two other products, Cowork and Claude Code.",
        personal: false
      },
      {
        name: "Perplexity",
        url: "https://www.perplexity.ai",
        description: "AI-powered search engine that answers questions with cited sources, combining conversational AI with real-time web results.",
        personal: false
      },
      {
        name: "NotebookLM",
        url: "https://notebooklm.google.com",
        description: "Google's AI research tool that analyzes your uploaded documents, generating summaries, Q&A, and audio overviews",
        personal: false
      }
    ]
  },
  {
    id: "ai-influencers",
    title: "AI Influencers",
    note: "People worth following for AI training, news and commentary.",
    items: [
      {
        name: "Bart Slodyczka",
        url: "https://www.youtube.com/results?search_query=bart+slodyczka",
        description: "Australian AI agency owner and educator.",
        personal: false
      },
      {
        name: "Ryan Doser",
        url: "https://www.youtube.com/@RyanDoserAI",
        description: "American AI-first marketer, solopreneur, and YouTuber. Ryan also runs a SKOOL class I highly recommend, AI-Marketing-Insiders.",
        personal: false
    },
    {
        name: "Sabrina Ramonov",
        url: "https://www.youtube.com/results?search_query=sabrina+ramonov+🍄",
        description: "Sabrina is a successful AI-first marketer and YouTuber, with a special mission to help women.",
        personal: false
    }
    ]
  },
  {
    id: "free-english",
    title: "Free English Learning Resources",
    note: "No-cost resources for self-study between sessions.",
    items: [
      {
        name: "Youglish",
        url: "https://youglish.com",
        description: "A \"free\" site that shows live native speakers using words and phrases in YouTube videos. Also great for shadowing practice.",
        personal: false
      },
      {
        name: "Power Thesaurus",
        url: "https://www.powerthesaurus.org",
        description: "A \"free\" site that provides synonyms and related words for any given term, as well as example sentences.",
        personal: false
      }
    ]
  },
  {
    id: "business-interview",
    title: "Business English & Interview Prep",
    note: "Resources specific to interview preparation and professional communication.",
    items: [
      {
        name: "Example: Glassdoor Interview Questions",
        url: "https://www.glassdoor.com/Interview/index.htm",
        description: "Placeholder entry — replace with resources you use in interview coaching sessions.",
        personal: false
      }
    ]
  }
];

/* ============================================================
   Nothing below this line needs to be touched to update content.
============================================================ */

const jumpnav = document.getElementById('jumpnav');
const main = document.getElementById('main-content');

function render() {
  main.innerHTML = '';
  jumpnav.innerHTML = '';

  CATEGORIES.forEach(cat => {
    const visibleItems = cat.items;

    const navLink = document.createElement('a');
    navLink.href = '#' + cat.id;
    navLink.textContent = cat.title;
    jumpnav.appendChild(navLink);

    const section = document.createElement('section');
    section.className = 'category';
    section.id = cat.id;

    const head = document.createElement('div');
    head.className = 'category-head';
    head.innerHTML = `<h2>${escapeHtml(cat.title)}</h2><span class="category-count">${visibleItems.length} resource${visibleItems.length === 1 ? '' : 's'}</span>`;
    section.appendChild(head);

    if (cat.note) {
      const note = document.createElement('p');
      note.className = 'category-note';
      note.textContent = cat.note;
      section.appendChild(note);
    }

    const list = document.createElement('ul');
    list.className = 'resource-list';

    visibleItems.forEach(item => {
      const li = document.createElement('li');
      li.className = 'resource-item';
      const tag = item.personal ? `<span class="tag">Terence's list</span>` : '';
      li.innerHTML = `<span class="name"><a href="${escapeAttr(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.name)}</a></span>${tag} — ${escapeHtml(item.description)}`;
      list.appendChild(li);
    });

    section.appendChild(list);
    main.appendChild(section);
  });
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
function escapeAttr(str) {
  return String(str).replace(/"/g, '&quot;');
}

document.getElementById('last-updated').textContent = LAST_UPDATED;
render();
</script>

</body>
</html>
